name: Update sentences

on:
  schedule:
    # GitHub Actions cron uses UTC.
    # Every Sunday 03:17 UTC (11:17 UTC+8).
    - cron: "17 3 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-sentences
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream sentences
        shell: bash
        run: |
          set -euo pipefail

          upstream="$RUNNER_TEMP/sentences-bundle"
          git clone --depth 1 https://github.com/hitokoto-osc/sentences-bundle.git "$upstream"

          for key in {a..l}; do
            file="$upstream/sentences/$key.json"
            test -s "$file"
            jq -e 'type == "array"' "$file" >/dev/null
          done

          rsync -a --delete "$upstream/sentences/" sentences/

      - name: Commit and push changes
        shell: bash
        run: |
          set -euo pipefail

          git add sentences

          if git diff --cached --quiet; then
            echo "No sentence updates found."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "chore: update sentences"
          git pull --rebase origin main
          git push origin HEAD:main
